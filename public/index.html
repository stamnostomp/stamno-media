<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>STAMNO_MEDIA</title>
  <link rel="stylesheet" href="tachyons.min.css">
  <link rel="stylesheet" href="stamno.css">
</head>
<body>
  <div id="app"></div>
  <script src="elm.js"></script>
  <script src="hls.min.js"></script>
  <script>
    var app = Elm.Main.init({ node: document.getElementById("app") });
    app.ports.storeToken.subscribe(function(t) {
      if (t) localStorage.setItem('fmsToken', t); else localStorage.removeItem('fmsToken');
      // m89: drop the session cookie too on sign-out
      document.cookie = 'fms_session=; Max-Age=0; Path=/';
    });
    app.ports.tokenStored.send(localStorage.getItem('fmsToken') || '');
    app.ports.scrollRow.subscribe(function(msg) {
      var el = document.getElementById(msg.rowId);
      if (el) el.scrollBy({ left: msg.delta, behavior: 'smooth' });
    });

    // HLS playback: when the <video> src is an .m3u8 playlist (the
    // server's transcode PlayMethod), route it through hls.js (or native
    // HLS where available) so duration and the seek bar are real.
    var hlsInstance = null;
    function wireHls(v) {
      var src = v.getAttribute('src') || '';
      // hls.js attachMedia() sets src to a blob: MSE object URL -- that is
      // OUR OWN hls instance talking, not a new source; ignore it or we
      // would tear the player down right after attaching (m66f).
      if (src.indexOf('blob:') === 0) return;
      if (v.dataset.hlsActive === '1' && src === '') return; // our own removeAttribute
      if (src === v.dataset.hlsSrc) return;
      v.dataset.hlsSrc = src;
      if (hlsInstance) { try { hlsInstance.destroy(); } catch (e) {} hlsInstance = null; }
      v.dataset.hlsActive = '0';
      if (src.indexOf('.m3u8') !== -1) {
        if (window.Hls && window.Hls.isSupported()) {
          // startPosition 0: the server playlist grows segment-by-segment
          // (no ENDLIST until the remux finishes) -- without this hls.js
          // would join at the "live edge" instead of the beginning.
          // The element may still have an in-flight NATIVE load of the
          // previous src (Elm sets the src attribute before we run), and
          // that pending load clobbers the MSE attach -- so abort it
          // first: drop the attribute and reset the element with load().
          v.removeAttribute('src');
          v.removeAttribute('autoplay'); // m95: we drive play() explicitly
          v.load();
          var h = new window.Hls({ startPosition: 0, liveSyncDurationCount: 3 });
          h.loadSource(src);
          h.attachMedia(v);
          // m89: the load() above cancels the autoplay attribute, so without
          // this the episode player would sit paused at readyState 0 forever
          v.dataset.hlsJs = '1';
          h.on(window.Hls.Events.MANIFEST_PARSED, function() {
            // m90/m91: resume seek. With a growing (live-style) playlist the
            // target is often not seekable yet at this point, so a one-shot
            // seek is silently dropped -- store a pending target computed from
            // the server-probed data-real-duration and let applyPendingResume
            // fire it once the seekable window covers it.
            var rp = v.dataset.resumePercent;
            var rd = parseFloat(v.dataset.realDuration || '');
            if (rp && isFinite(rd) && rd > 0) {
              v.dataset.resumeTarget = String(rd * (parseFloat(rp) / 100));
              v.dataset.resumeArmed = String(Date.now());
            }
            if (v.dataset.resumeTarget) {
              // m94/m95: if the target is not seekable yet, WAIT paused with the
              // overlay instead of playing from 0; applyPendingResume seeks+plays
              // once the playlist covers the target
              if (!applyPendingResume(v)) {
                showResumeWait(v, parseFloat(v.dataset.resumeTarget));
                v.pause();
              }
            } else {
              var p = v.play();
              if (p && p.catch) p.catch(function() {});
            }
          });
          // m91: retry the pending resume as fragments/levels arrive
          h.on(window.Hls.Events.FRAG_BUFFERED, function() { applyPendingResume(v); });
          h.on(window.Hls.Events.LEVEL_UPDATED, function() { applyPendingResume(v); });
          // m90/m95: recover hls.js errors instead of freezing: fatal network
          // errors -> startLoad again, fatal media errors -> recoverMediaError,
          // buffer stalls -> nudge. Only surface a banner after repeated
          // failures of the same kind.
          var errTries = {};
          h.on(window.Hls.Events.ERROR, function(_evt, data) {
            if (!data) return;
            var k = data.type + ':' + data.details;
            errTries[k] = (errTries[k] || 0) + 1;
            if (data.fatal) {
              if (data.type === window.Hls.ErrorTypes.NETWORK_ERROR && errTries[k] <= 3) {
                h.startLoad();
              } else if (data.type === window.Hls.ErrorTypes.MEDIA_ERROR && errTries[k] <= 3) {
                h.recoverMediaError();
              } else if (errTries[k] > 3) {
                showPlayerError((data.details || 'hls.js fatal error') + ' - the transcode may have failed, try again or pick another release.');
              }
            } else if (data.details === 'bufferStalledError' && errTries[k] <= 5) {
              // playback froze on an empty buffer: restart loading and, if we
              // are not waiting on a resume target, make sure we are playing
              h.startLoad();
              if (!v.dataset.resumeTarget && v.paused) { var p2 = v.play(); if (p2 && p2.catch) p2.catch(function() {}); }
            }
          });
          hlsInstance = h;
          v.dataset.hlsActive = '1';
        } else if (v.canPlayType && v.canPlayType('application/vnd.apple.mpegurl')) {
          v.dataset.hlsActive = '1'; // native HLS (Safari): keep src
        }
      }
    }
    // Observe the whole subtree for src-attribute changes (Elm re-renders
    // often enough that a single per-element observer missed the initial
    // attribute set -- m66f). wireHls is idempotent (hlsSrc/hlsActive
    // guards), so calling it on every mutation is safe and cheap.
    var playerObserver = new MutationObserver(function() {
      var v = document.getElementById('media-player');
      if (v) wireHls(v);
    });
    playerObserver.observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['src'] });

    app.ports.videoCommand.subscribe(function(cmd) {
      var v = document.getElementById('media-player');
      if (!v) return;
      switch (cmd.action) {
        case 'play':
          v.play();
          break;
        case 'pause':
          v.pause();
          break;
        case 'seek':
          v.currentTime = cmd.value;
          break;
        case 'skip':
          v.currentTime = Math.max(0, v.currentTime + cmd.value);
          break;
        case 'subtitle':
          // m70: show text track #value (Float; -1 = off)
          var want = Math.round(cmd.value);
          for (var i = 0; i < v.textTracks.length; i++) {
            v.textTracks[i].mode = (i === want) ? 'showing' : 'hidden';
          }
          break;
        case 'mute':
          v.muted = !v.muted;
          break;
        case 'volume':
          v.volume = cmd.value;
          if (cmd.value > 0) v.muted = false;
          break;
        case 'fullscreen':
          var stage = document.getElementById('player-stage');
          if (!stage) break;
          if (document.fullscreenElement === stage) {
            document.exitFullscreen();
          } else if (stage.requestFullscreen) {
            stage.requestFullscreen();
          }
          break;
      }
    });

    // m86: the authoritative duration is the server-probed one
    // (data-real-duration, set from PlaybackInfo MediaStreams) whenever the
    // browser's own v.duration is unknown (chunked direct-play) or still
    // growing (in-progress HLS playlist) - otherwise the seek bar/clock
    // jump as chunks arrive.
    function realDuration(v) {
      // m92: the server-probed data-real-duration is authoritative whenever
      // present. During a growing (in-progress) HLS transcode v.duration is
      // finite but PARTIAL, and using it corrupted /progress percentages
      // (ct/partial) and the seek bar.
      var d = parseFloat(v.dataset.realDuration || '');
      if (isFinite(d) && d > 0) return d;
      if (isFinite(v.duration) && v.duration > 0) return v.duration;
      return 0;
    }
    function reportVideoStatus() {
      var v = document.getElementById('media-player');
      if (!v) return;
      app.ports.videoStatus.send({
        currentTime: v.currentTime || 0,
        duration: realDuration(v),
        paused: v.paused,
        muted: v.muted,
        volume: v.volume
      });
    }
    // m89/m90: surface media errors (e.g. failed transcode) instead of a silent
    // hang. The banner is a shared helper so hls.js fatal errors reuse it.
    function showPlayerError(msg) {
      var v = document.getElementById('media-player');
      var banner = document.getElementById('player-error-banner');
      if (!banner) {
        banner = document.createElement('div');
        banner.id = 'player-error-banner';
        banner.style.cssText = 'position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:20;background:rgba(120,0,0,0.85);color:#fff;padding:8px 16px;font:13px sans-serif;border-radius:4px;';
        var stage = document.getElementById('player-stage');
        if (stage) stage.appendChild(banner); else document.body.appendChild(banner);
      }
      banner.textContent = 'Playback error: ' + msg;
    }
    function hidePlayerError() {
      var b = document.getElementById('player-error-banner');
      if (b) b.remove();
    }
    // m91/m94: apply a pending resume target once it is inside the seekable
    // window (growing live-style playlists only become seekable as segments
    // arrive). Returns true when the seek was applied. While waiting, show a
    // "RESUMING AT ..." overlay and keep the video paused so the movie never
    // visibly plays from 0:00 first.
    function fmtClock(sec) {
      sec = Math.max(0, Math.round(sec));
      var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), ss = sec % 60;
      var mm = (h > 0 && m < 10) ? '0' + m : '' + m;
      var s2 = (ss < 10) ? '0' + ss : '' + ss;
      return (h > 0 ? h + ':' : '') + mm + ':' + s2;
    }
    function showResumeWait(v, target) {
      var b = document.getElementById('resume-wait');
      if (!b) {
        b = document.createElement('div');
        b.id = 'resume-wait';
        b.style.cssText = 'position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:20;background:rgba(10,11,13,0.85);color:#fff;padding:8px 16px;font:13px sans-serif;border-radius:4px;border:1px solid rgba(255,255,255,0.2);';
        var stage = document.getElementById('player-stage');
        if (stage) stage.appendChild(b); else document.body.appendChild(b);
      }
      b.textContent = 'RESUMING AT ' + fmtClock(target) + ' ...';
    }
    function hideResumeWait() {
      var b = document.getElementById('resume-wait');
      if (b) b.remove();
    }
    function applyPendingResume(v) {
      var t = parseFloat(v.dataset.resumeTarget || '');
      if (!isFinite(t) || t <= 0) return false;
      var n = v.seekable.length;
      var end = n ? v.seekable.end(n - 1) : 0;
      // m94: if the target is still beyond the grown playlist after 90s,
      // clamp to the current end instead of waiting forever
      var armed = parseFloat(v.dataset.resumeArmed || '0');
      if (armed && Date.now() - armed > 90000 && end > 0) t = Math.min(t, end - 1);
      if (t <= end + 0.5) {
        v.currentTime = t;
        delete v.dataset.resumeTarget;
        delete v.dataset.resumePercent;
        hideResumeWait();
        var p = v.play();
        if (p && p.catch) p.catch(function() {});
        return true;
      }
      return false;
    }
    document.addEventListener('seekablechange', function(event) {
      if (event.target && event.target.id === 'media-player') applyPendingResume(event.target);
    }, true);
    document.addEventListener('progress', function(event) {
      if (event.target && event.target.id === 'media-player') applyPendingResume(event.target);
    }, true);
    setInterval(function() {
      var v = document.getElementById('media-player');
      if (v && v.dataset.resumeTarget) applyPendingResume(v);
    }, 1000);
    document.addEventListener('error', function(event) {
      var v = event.target;
      // m90: when hls.js owns the element the browser's own attempt to demux
      // the .m3u8 fires a spurious native error before/while hls.js attaches --
      // ignore it; real problems arrive as hls.js FATAL errors (above).
      if (v && v.id === 'media-player' && v.error && v.dataset.hlsActive !== '1') {
        showPlayerError((v.error.message || ('code ' + v.error.code)) + ' - the transcode may have failed, try again or pick another release.');
      }
    }, true);
    // m90: once playback actually starts any earlier error is stale -- clear it
    document.addEventListener('playing', function(event) {
      if (event.target && event.target.id === 'media-player') {
        hidePlayerError();
        if (!event.target.dataset.resumeTarget) hideResumeWait();
      }
    }, true);
    // m94: mute while the tab runs in the background, restore on return
    // (only when the user had not muted manually)
    document.addEventListener('visibilitychange', function() {
      var v = document.getElementById('media-player');
      if (!v) return;
      if (document.hidden) {
        if (!v.muted) { v.dataset.wasMuted = '0'; v.muted = true; }
      } else if (v.dataset.wasMuted === '0') {
        v.muted = false;
        delete v.dataset.wasMuted;
      }
    });
    ['loadedmetadata', 'play', 'pause', 'volumechange', 'ended'].forEach(function(evt) {
      document.addEventListener(evt, function(event) {
        if (event.target && event.target.id === 'media-player') reportVideoStatus();
      }, true);
    });

    // 'timeupdate' alone is too coarse for a smooth seek bar/clock (browsers
    // throttle it to roughly every 250ms-1s). Poll on a tighter interval
    // instead, while actually playing.
    setInterval(function() {
      var v = document.getElementById('media-player');
      if (v && !v.paused) reportVideoStatus();
    }, 100);

    // Resumes from the last reported position, once, when a fresh video
    // element's metadata becomes available (before the user sees it start
    // from 0). The attribute is cleared immediately after so later
    // metadata events (if any) don't repeatedly override manual seeking.
    document.addEventListener('loadedmetadata', function(event) {
      var v = event.target;
      if (!v || v.id !== 'media-player') return;
      // m90: hls.js path resumes in MANIFEST_PARSED with the server-probed
      // duration (the growing playlist makes v.duration wrong here)
      if (v.dataset.hlsJs === '1') return;
      // m91: do NOT consume data-resume-percent here. The player first renders
      // with the direct /stream src and only switches to the HLS playlist when
      // PlaybackInfo arrives; consuming the attribute on the direct load loses
      // the resume position when hls.js then restarts at 0. Apply (idempotent)
      // but leave the attribute for the MANIFEST_PARSED path.
      var resumePercent = v.dataset.resumePercent;
      var dur = realDuration(v);
      if (resumePercent && dur > 0) {
        var target = dur * (parseFloat(resumePercent) / 100);
        if (Math.abs(v.currentTime - target) > 5) v.currentTime = target;
      }
    }, true);

    // Periodically reports playback position to the server so it can
    // compute "continue watching". Fire-and-forget, independent of Elm.
    var API_BASE = window.location.origin; // m69: same origin as the page

    // m69: also maintain a playback SESSION so GET /Sessions shows who is
    // watching right now. Start once per item, ping at most every 10s
    // (sessions expire server-side after 90s without a ping), stop on end.
    var sessItem = null, sessId = null, lastPing = 0;
    function tokenQ() {
      // m89: the fms_session cookie (set at login) authenticates these
      // fire-and-forget calls; no token in the URL any more
      return '';
    }
    function sendSession(itemId, stopped) {
      var now = Date.now();
      if (stopped) {
        if (sessId) fetch(API_BASE + '/Sessions/Playing/Stopped' + tokenQ(), {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ItemId: itemId, PlaySessionId: sessId })
        }).catch(function() {});
        sessItem = null; sessId = null;
        return;
      }
      if (sessItem !== itemId) {
        sessItem = itemId; sessId = null;
        fetch(API_BASE + '/Sessions/Playing' + tokenQ(), {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ItemId: itemId, PositionSeconds: 0 })
        }).then(function(r) { return r.json(); })
          .then(function(s) { if (s && s.Id) sessId = s.Id; })
          .catch(function() {});
        lastPing = now;
        return;
      }
      if (sessId && now - lastPing > 10000) {
        lastPing = now;
        fetch(API_BASE + '/Sessions/Playing/Ping' + tokenQ(), {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ PlaySessionId: sessId })
        }).catch(function() {});
      }
    }
    function sendProgress() {
      var v = document.getElementById('media-player');
      if (!v) return;
      var dur = realDuration(v);
      if (!dur) return;
      var itemId = v.dataset.itemId;
      if (!itemId) return;
      fetch(API_BASE + '/progress' + tokenQ(), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: itemId, currentTime: v.currentTime, duration: dur })
      }).catch(function() {});
      sendSession(itemId, false);
    }

    setInterval(function() {
      var v = document.getElementById('media-player');
      if (v && !v.paused) sendProgress();
    }, 5000);

    document.addEventListener('pause', function(event) {
      if (event.target && event.target.id === 'media-player') sendProgress();
    }, true);
    document.addEventListener('ended', function(event) {
      if (event.target && event.target.id === 'media-player') {
        sendProgress();
        var id = event.target.dataset.itemId;
        if (id) {
          sendSession(id, true);
          app.ports.videoEnded.send(id);
        }
      }
    }, true);
  </script>
</body>
</html>
